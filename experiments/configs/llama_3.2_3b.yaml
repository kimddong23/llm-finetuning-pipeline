# =============================================================================
# Llama-3.2-3B Configuration
# =============================================================================
# Meta's Llama 3.2 3B model - strong multilingual capabilities
# Model size: 3B parameters
# Note: Requires Llama license acceptance on HuggingFace
# =============================================================================

# Inherit from base config
_base_: "base_config.yaml"

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model:
  model_name: "meta-llama/Llama-3.2-3B"
  trust_remote_code: true
  use_flash_attention_2: false

# -----------------------------------------------------------------------------
# LoRA Settings (Llama-optimized)
# -----------------------------------------------------------------------------
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"  # Full attention for Llama

# -----------------------------------------------------------------------------
# Training Settings (Mac M3 Pro optimized)
# -----------------------------------------------------------------------------
training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8  # Effective batch = 16

  num_train_epochs: 3
  learning_rate: 1.5e-4  # Slightly lower for larger model
  warmup_steps: 150

  gradient_checkpointing: true
  max_grad_norm: 1.0

# -----------------------------------------------------------------------------
# Data Settings
# -----------------------------------------------------------------------------
data:
  max_length: 1024  # Memory consideration

# -----------------------------------------------------------------------------
# Logging & Saving
# -----------------------------------------------------------------------------
logging:
  output_dir: "results/models/qlora-llama-3.2-3b"
  logging_steps: 10

saving:
  save_steps: 200
  save_total_limit: 3

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  eval_steps: 200

# -----------------------------------------------------------------------------
# W&B Settings
# -----------------------------------------------------------------------------
wandb:
  run_name: "llama-3.2-3b-qlora"
  tags:
    - "llama"
    - "3b"
    - "code-generation"
