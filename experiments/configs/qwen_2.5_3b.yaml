# =============================================================================
# Qwen2.5-Coder-3B Configuration
# =============================================================================
# Alibaba's Qwen2.5 Coder - specialized for code generation
# Model size: 3B parameters
# Best choice for: Code generation tasks, good multilingual support
# =============================================================================

# Inherit from base config
_base_: "base_config.yaml"

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model:
  model_name: "Qwen/Qwen2.5-Coder-3B"
  trust_remote_code: true
  use_flash_attention_2: false

# -----------------------------------------------------------------------------
# LoRA Settings (Qwen-optimized)
# -----------------------------------------------------------------------------
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"  # Qwen: efficient with q and v only

# -----------------------------------------------------------------------------
# Training Settings (Mac M3 Pro optimized)
# -----------------------------------------------------------------------------
training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8  # Effective batch = 16

  num_train_epochs: 3
  learning_rate: 2.0e-4
  warmup_steps: 100

  gradient_checkpointing: true
  max_grad_norm: 1.0

# -----------------------------------------------------------------------------
# Data Settings
# -----------------------------------------------------------------------------
data:
  max_length: 1024

# -----------------------------------------------------------------------------
# Logging & Saving
# -----------------------------------------------------------------------------
logging:
  output_dir: "results/models/qlora-qwen-2.5-coder-3b"
  logging_steps: 10

saving:
  save_steps: 200
  save_total_limit: 3

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  eval_steps: 200

# -----------------------------------------------------------------------------
# W&B Settings
# -----------------------------------------------------------------------------
wandb:
  run_name: "qwen-2.5-coder-3b-qlora"
  tags:
    - "qwen"
    - "coder"
    - "3b"
    - "code-generation"
