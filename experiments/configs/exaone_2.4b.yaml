# =============================================================================
# EXAONE-3.5-2.4B-Instruct Configuration
# =============================================================================
# LG AI Research's EXAONE model - optimized for Korean language understanding
# Model size: 2.4B parameters
# Recommended for: Mac M3 Pro (18GB), limited VRAM GPUs
# =============================================================================

# Inherit from base config
_base_: "base_config.yaml"

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model:
  model_name: "LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct"
  trust_remote_code: true
  use_flash_attention_2: false  # Not supported on MPS

# -----------------------------------------------------------------------------
# LoRA Settings (EXAONE-optimized)
# -----------------------------------------------------------------------------
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"  # EXAONE: focus on q and v projections

# -----------------------------------------------------------------------------
# Training Settings (Mac M3 Pro optimized)
# -----------------------------------------------------------------------------
training:
  per_device_train_batch_size: 4  # Balanced for 18GB RAM
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2  # Effective batch = 8

  num_train_epochs: 1  # Reduced to 1 epoch for faster iteration
  max_steps: 500  # Fast prototype - 44% of full epoch
  learning_rate: 2.0e-4
  warmup_steps: 50  # Reduced proportionally

  gradient_checkpointing: true
  max_grad_norm: 1.0

# -----------------------------------------------------------------------------
# Data Settings
# -----------------------------------------------------------------------------
data:
  max_length: 512  # Fast prototype training

# -----------------------------------------------------------------------------
# Logging & Saving
# -----------------------------------------------------------------------------
logging:
  output_dir: "results/models/qlora-exaone-2.4b"
  logging_steps: 10

saving:
  save_steps: 100  # More frequent saves
  save_total_limit: 5

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  eval_steps: 100  # More frequent evaluation

# -----------------------------------------------------------------------------
# W&B Settings
# -----------------------------------------------------------------------------
wandb:
  run_name: "exaone-2.4b-qlora"
  tags:
    - "exaone"
    - "2.4b"
    - "korean"
    - "code-generation"
