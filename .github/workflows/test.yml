name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base.txt
        pip install -r requirements/dev.txt

    - name: Lint with ruff
      run: |
        ruff check llm_finetuning data/scripts experiments/training tests
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy llm_finetuning data/scripts experiments/training
      continue-on-error: true

    - name: Run data pipeline tests
      run: |
        cd data/scripts && python test_pipeline.py
      continue-on-error: true

    - name: Run training tests
      run: |
        cd experiments/training && python test_train.py
      continue-on-error: true

    - name: Run pytest
      run: |
        pytest tests/ --cov=llm_finetuning --cov-report=xml
      continue-on-error: true

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true
